    <!-- 1. Two Sum
Given an array of integers 
nums and an integer 
they add up to 
target , return indices of the two numbers such that
target . - Each input has exactly one solution - You may not use the same element twice 
Return the answer in any order -->

    <script>
        const nums = [1, 3, 5, 8];
        const target = 4;

        function twoSum() {
            for (let i = 0; i < nums.length; i++) {
                for (let j = i + 1; j < nums.length; j++) {
                    if (nums[i] + nums[j] == target) {
                        console.log(`nums: '${i}, ${j}'`);

                        console.log(`index: '${nums[i]}, ${nums[j]}'`);
                    }
                }
            }
        }

        twoSum();
    </script>
